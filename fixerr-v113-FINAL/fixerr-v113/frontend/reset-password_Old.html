<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password — Fixerr</title>
  <link rel="stylesheet" href="mobile.css" />
  <style>
    :root{--accent:#3D8B37;--accent2:#2E6B29;--accent-light:#E8F5E2;--border-accent:#A8E06A;
      --text:#1A211B;--muted:#5C665B;--border:#E3E8DE;--bg2:#F6F8F3;--radius:16px;--radius-sm:10px;
      --shadow:0 1px 2px rgba(20,30,20,.04),0 10px 30px rgba(20,30,20,.07);}
    *{box-sizing:border-box;}
    body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      color:var(--text);background:linear-gradient(160deg,#F0FBF0,#fff 55%,#F8FAF7);min-height:100vh;
      display:flex;align-items:center;justify-content:center;padding:1.5rem;}
    .card{width:100%;max-width:430px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);
      box-shadow:var(--shadow);padding:2.2rem 2rem;}
    .logo{display:inline-flex;align-items:center;text-decoration:none;font-size:1.5rem;font-weight:800;color:var(--accent);letter-spacing:-.5px;margin-bottom:1.4rem;}
    .logo span{color:var(--text);}
    h1{font-size:1.5rem;margin:0 0 .4rem;letter-spacing:-.02em;}
    .sub{color:var(--muted);font-size:.95rem;line-height:1.6;margin:0 0 1.6rem;}
    label{display:block;font-size:.85rem;font-weight:600;margin-bottom:.4rem;margin-top:1rem;}
    label:first-of-type{margin-top:0;}
    .field{position:relative;}
    input{width:100%;border:1.5px solid var(--border);border-radius:var(--radius-sm);padding:.75rem .9rem;
      font-size:1rem;outline:none;background:#fff;transition:border-color .15s;}
    input:focus{border-color:var(--accent);}
    .hint{color:var(--muted);font-size:.78rem;margin-top:.35rem;}
    .btn{width:100%;background:var(--accent);color:#fff;border:none;border-radius:50px;padding:.85rem 1.5rem;
      font-size:1rem;font-weight:700;cursor:pointer;margin-top:1.3rem;transition:background .15s;}
    .btn:hover{background:var(--accent2);}
    .btn:disabled{opacity:.7;cursor:default;}
    .err{color:#DC2626;font-size:.82rem;margin-top:.5rem;min-height:1rem;}
    .back{display:inline-block;margin-top:1.4rem;color:var(--accent);text-decoration:none;font-weight:600;font-size:.9rem;}
    .back:hover{text-decoration:underline;}
    .ok-box{background:var(--accent-light);border:1px solid var(--border-accent);border-radius:var(--radius-sm);
      padding:1.1rem 1.2rem;color:var(--accent2);font-size:.92rem;line-height:1.6;}
    .warn-box{background:#FFFBEB;border:1px solid #FCD34D;border-radius:var(--radius-sm);padding:1.1rem 1.2rem;color:#92400E;font-size:.92rem;line-height:1.6;}
    .spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .6s linear infinite;vertical-align:-2px;margin-right:.4rem;}
    @keyframes sp{to{transform:rotate(360deg);}}
  </style>
</head>
<body>
  <div class="card">
    <a href="index.html" class="logo" style="display:inline-block;margin-bottom:1.4rem;"><img src="fixerr-logo.png" alt="Fixerr" style="height:42px;object-fit:contain;transition:transform 0.2s ease;" onmouseover="this.style.transform='scale(1.08)'" onmouseout="this.style.transform='none'"></a>

    <div id="form-view">
      <h1>Set a new password</h1>
      <p class="sub">Choose a new password for your Fixerr account.</p>
      <form id="reset-form" onsubmit="return submitReset(event)">
        <label for="pw">New password</label>
        <input id="pw" name="pw" type="password" autocomplete="new-password" placeholder="At least 8 characters" required aria-label="New password" />
        <div class="hint">Use at least 8 characters.</div>
        <label for="pw2">Confirm new password</label>
        <input id="pw2" name="pw2" type="password" autocomplete="new-password" placeholder="Re-enter your new password" required aria-label="Confirm new password" />
        <div class="err" id="err"></div>
        <button class="btn" id="submit-btn" type="submit">Reset password</button>
      </form>
      <a href="login.html" class="back">← Back to login</a>
    </div>

    <div id="done-view" style="display:none;">
      <h1>Password reset ✓</h1>
      <div class="ok-box">Your password has been updated. You can now log in with your new password.</div>
      <a href="login.html" class="btn" style="display:block;text-align:center;text-decoration:none;">Go to login →</a>
    </div>

    <div id="invalid-view" style="display:none;">
      <h1>Link problem</h1>
      <div class="warn-box" id="invalid-msg">This reset link is invalid or has expired.</div>
      <a href="forgot-password.html" class="back">← Request a new link</a>
    </div>
  </div>

  <script>
    const API_BASE =
      location.hostname === "localhost" || location.hostname === "127.0.0.1"
        ? "http://localhost:3001"
        : location.origin;

    const TOKEN = new URLSearchParams(location.search).get("token") || "";
    if (!TOKEN) {
      document.getElementById("form-view").style.display = "none";
      document.getElementById("invalid-msg").textContent =
        "This reset link is missing its token. Please request a new password reset link.";
      document.getElementById("invalid-view").style.display = "block";
    }

    async function submitReset(e) {
      e.preventDefault();
      const btn = document.getElementById("submit-btn");
      const errEl = document.getElementById("err");
      const pw = document.getElementById("pw").value;
      const pw2 = document.getElementById("pw2").value;
      errEl.textContent = "";
      if (pw.length < 8) { errEl.textContent = "Password must be at least 8 characters."; return false; }
      if (pw !== pw2) { errEl.textContent = "The two passwords don't match."; return false; }
      btn.disabled = true;
      btn.innerHTML = '<span class="spin"></span>Resetting…';
      try {
        const r = await fetch(API_BASE + "/api/auth/reset", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: TOKEN, password: pw }),
        });
        const d = await r.json();
        if (!r.ok) {
          // Expired / already-used links get a dedicated recovery view.
          if (/expired|invalid|already been used|link/i.test(d.error || "")) {
            document.getElementById("form-view").style.display = "none";
            document.getElementById("invalid-msg").textContent = d.error;
            document.getElementById("invalid-view").style.display = "block";
            return false;
          }
          throw new Error(d.error || "Could not reset the password.");
        }
        document.getElementById("form-view").style.display = "none";
        document.getElementById("done-view").style.display = "block";
      } catch (ex) {
        errEl.textContent = ex.message;
        btn.disabled = false;
        btn.textContent = "Reset password";
      }
      return false;
    }
  </script>
</body>
</html>
