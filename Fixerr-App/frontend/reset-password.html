<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Reset Password – Fixerr</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="mobile.css">
<!-- PAGE-SPECIFIC OVERRIDE: this page needs a sticky-footer flex layout
     (body stretches full viewport height so the footer stays pinned to
     the bottom on short-content pages) and uses --bg (white) instead of
     the --bg2 (light gray) in styles.css shared body{} rule. -->
<style>body{background:var(--bg);display:flex;flex-direction:column;min-height:100vh;}</style>
</head><body>

<div id="site-header"></div>
<div style="padding:9rem 2.5rem 5rem;max-width:460px;margin:0 auto;flex:1 0 auto;width:100%;">
  <div id="done-view" style="display:none;background:var(--accent-light);border:1.5px solid var(--border-accent);border-radius:var(--radius);padding:2rem;text-align:center;">
    <div style="font-size:2rem;margin-bottom:0.5rem;">✅</div>
    <h3 style="font-size:1.15rem;font-weight:800;margin-bottom:0.4rem;">Password reset</h3>
    <p style="color:var(--muted);font-size:0.92rem;line-height:1.6;">Your password has been updated. You can now log in with your new password.</p>
    <a href="login.html" class="btn-primary btn-lg" style="display:inline-block;text-decoration:none;margin-top:1.2rem;">Go to login →</a>
  </div>

  <div id="invalid-view" style="display:none;">
    <h1 style="font-size:1.65rem;margin-bottom:1.2rem;">Link problem</h1>
    <div class="alert alert-warn" id="invalid-msg">This reset link is invalid or has expired.</div>
    <p style="text-align:center;margin-top:1.5rem;">
      <a href="forgot-password.html" style="color:var(--accent);font-weight:600;text-decoration:none;font-size:0.9rem;">← Request a new link</a>
    </p>
  </div>

  <div id="form-view">
    <h1 style="font-size:1.65rem;margin-bottom:0.5rem;">Set a new password</h1>
    <p style="color:var(--muted);margin-bottom:2rem;line-height:1.7;">Choose a new password for your Fixerr account.</p>

    <div class="form-card">
      <div class="form-group">
        <label>New password</label>
        <input type="password" id="pw" placeholder="At least 8 characters" autocomplete="new-password" name="pw" aria-label="New password">
      </div>
      <div class="form-group">
        <label>Confirm new password</label>
        <input type="password" id="pw2" placeholder="Re-enter your new password" autocomplete="new-password" name="pw2" aria-label="Confirm new password">
      </div>
      <button id="submit-btn" onclick="submitReset()" class="btn-primary btn-lg" style="width:100%;">Reset password →</button>
    </div>

    <p style="text-align:center;margin-top:1.5rem;">
      <a href="login.html" style="color:var(--accent);font-weight:600;text-decoration:none;font-size:0.9rem;">← Back to login</a>
    </p>
  </div>
</div>
<div id="site-footer" style="flex-shrink:0;"></div>
<script src="nav.js"></script>
<script>
document.addEventListener("DOMContentLoaded", initSharedLayout);
// ── RESET PASSWORD FORM ─────────────────────────────
const TOKEN = new URLSearchParams(location.search).get("token") || "";
document.addEventListener('DOMContentLoaded', () => {
  if (!TOKEN) {
    document.getElementById("form-view").style.display = "none";
    document.getElementById("invalid-msg").textContent = "This reset link is missing its token. Please request a new password reset link.";
    document.getElementById("invalid-view").style.display = "block";
  }
});

async function submitReset(){
  clearErr();
  const pw=document.getElementById('pw').value;
  const pw2=document.getElementById('pw2').value;
  if(pw.length<8){showErr('pw','Password must be at least 8 characters');return;}
  if(pw!==pw2){showErr('pw2',"The two passwords don't match");return;}
  const btn=document.getElementById('submit-btn');btn.textContent='Resetting...';btn.disabled=true;
  try{
    await API.post('/api/auth/reset',{token:TOKEN,password:pw});
    document.getElementById('form-view').style.display='none';
    document.getElementById('done-view').style.display='block';
  }catch(e){
    if(/expired|invalid|already been used|link/i.test(e.message||"")){
      document.getElementById('form-view').style.display='none';
      document.getElementById('invalid-msg').textContent=e.message;
      document.getElementById('invalid-view').style.display='block';
      return;
    }
    showErr('pw2',e.message);
    btn.textContent='Reset password →';btn.disabled=false;
  }
}

</script></body></html>
