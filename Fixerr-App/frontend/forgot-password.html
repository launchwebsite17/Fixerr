<!DOCTYPE html><html lang="en"><head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Forgot Password – Fixerr</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="mobile.css">
<!-- PAGE-SPECIFIC OVERRIDE: this page needs a sticky-footer flex layout
     (body stretches full viewport height so the footer stays pinned to
     the bottom on short-content pages) and uses --bg (white) instead of
     the --bg2 (light gray) in styles.css shared body{} rule. -->
<style>body{background:var(--bg);display:flex;flex-direction:column;min-height:100vh;}</style>
</head><body>

<div id="site-header"></div>
<div style="padding:9rem 2.5rem 5rem;max-width:460px;margin:0 auto;flex:1 0 auto;width:100%;">
  <div id="done-view" style="display:none;background:var(--accent-light);border:1.5px solid var(--border-accent);border-radius:var(--radius);padding:2rem;text-align:center;">
    <div style="font-size:2rem;margin-bottom:0.5rem;">✅</div>
    <h3 style="font-size:1.15rem;font-weight:800;margin-bottom:0.4rem;">Check your inbox</h3>
    <p id="done-msg" style="color:var(--muted);font-size:0.92rem;line-height:1.6;"></p>
    <a href="login.html" style="color:var(--accent);font-weight:700;text-decoration:none;display:inline-block;margin-top:1.2rem;">← Back to login</a>
  </div>

  <div id="form-view">
    <h1 style="font-size:1.65rem;margin-bottom:0.5rem;">Forgot your password?</h1>
    <p style="color:var(--muted);margin-bottom:2rem;line-height:1.7;">Enter the email linked to your Fixerr account and we'll send you a link to reset your password.</p>

    <div class="form-card">
      <div class="form-group">
        <label>Email address</label>
        <input type="email" id="email" placeholder="you@email.com" name="email" aria-label="Email address">
      </div>
      <button id="submit-btn" onclick="submitForgot()" class="btn-primary btn-lg" style="width:100%;">Send reset link →</button>
    </div>

    <p style="text-align:center;margin-top:1.5rem;">
      <a href="login.html" style="color:var(--accent);font-weight:600;text-decoration:none;font-size:0.9rem;">← Back to login</a>
    </p>
  </div>
</div>
<div id="site-footer" style="flex-shrink:0;"></div>
<script src="nav.js"></script>
<script>
document.addEventListener("DOMContentLoaded", initSharedLayout);
// ── FORGOT PASSWORD FORM ─────────────────────────────
// Prefill email if arriving from the login page
const _q = new URLSearchParams(location.search);
document.addEventListener('DOMContentLoaded', () => {
  if (_q.get("email")) {
    const emailEl = document.getElementById("email");
    if (emailEl) emailEl.value = _q.get("email");
  }
});

async function submitForgot(){
  clearErr();
  const email=v('email');
  if(!email){showErr('email','Please enter your email address');return;}
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){showErr('email','Enter a valid email address');return;}
  const btn=document.getElementById('submit-btn');btn.textContent='Sending...';btn.disabled=true;
  try{
    await API.post('/api/auth/forgot',{email});
    document.getElementById('form-view').style.display='none';
    document.getElementById('done-msg').innerHTML='If an account exists for <strong>'+email.replace(/</g,'&lt;')+'</strong>, a password reset link is on its way. The link expires in 45 minutes.';
    document.getElementById('done-view').style.display='block';
  }catch(e){
    showErr('email',e.message);
    btn.textContent='Send reset link →';btn.disabled=false;
  }
}

</script></body></html>
